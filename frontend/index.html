<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Gate Pass - Portal Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Fullscreen Balanced Campus Background Layer -->
  <div class="bg-overlay"></div>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="brand-logo">
      🏷️ GatePass <span>Portal</span>
    </div>
    <div class="nav-links">
      <a href="/index.html" class="nav-item active">Home</a>
      <a href="#login" class="nav-item">Pass Status</a>
    </div>
    <button class="btn-login-nav">Login</button>
  </nav>

  <!-- Main Content Container -->
  <main class="main-container" id="login">
    <div class="login-card fade-in-section">
      <h2 class="card-title">Portal Login</h2>

      <!-- Role Selector Tabs -->
      <div class="role-tabs">
        <button class="role-tab active" onclick="switchRole(event, 'student')">Student</button>
        <button class="role-tab" onclick="switchRole(event, 'warden')">Warden</button>
        <button class="role-tab" onclick="switchRole(event, 'security')">Security</button>
      </div>

      <!-- Dynamic Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label id="idLabel" for="identifier">Student Registration No / ID</label>
          <input
            type="text"
            id="identifier"
            class="form-control"
            placeholder="e.g. STU001"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter your password"
            required
          >
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Login as Student</button>
        <p id="loginMessage" class="message"></p>
      </form>

      <div class="card-footer">
        Demo logins: STU001 / student123 &nbsp;•&nbsp; WARDEN01 / warden123 &nbsp;•&nbsp; SEC01 / security123
      </div>
    </div>
  </main>

  <!-- Page Footer -->
  <footer class="footer">
    Digital Gate Pass Verification System &bull; Hackathon Edition
    <div style="margin-top: 6px; font-size: 12px; opacity: 0.75;">
      <span id="apiEndpointIndicator">Backend: auto</span>
      &bull; <a href="#" id="setApiBtn" style="color: inherit; text-decoration: underline;">Configure API</a>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    let currentRole = 'student';

    const rolePages = {
      STUDENT: '/student.html',
      WARDEN: '/warden.html',
      SECURITY: '/security.html',
    };

    function updateBackendIndicator() {
      const el = document.getElementById('apiEndpointIndicator');
      const base = getApiBaseUrl();
      if (el) {
        el.textContent = base ? `Backend: ${base}` : 'Backend: Same-Origin / Proxy';
      }
    }
    updateBackendIndicator();

    document.getElementById('setApiBtn').addEventListener('click', (e) => {
      e.preventDefault();
      const current = getApiBaseUrl();
      const entered = prompt('Enter your Backend API URL (e.g. https://your-backend.onrender.com), or leave empty for same-origin proxy:', current);
      if (entered !== null) {
        setApiBaseUrl(entered);
        updateBackendIndicator();
      }
    });

    function switchRole(event, role) {
      currentRole = role;

      const tabs = document.querySelectorAll('.role-tab');
      tabs.forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');

      const idLabel = document.getElementById('idLabel');
      const identifierInput = document.getElementById('identifier');
      const submitBtn = document.getElementById('submitBtn');

      if (role === 'student') {
        idLabel.innerText = 'Student Registration No / ID';
        identifierInput.placeholder = 'e.g. STU001';
        submitBtn.innerText = 'Login as Student';
      } else if (role === 'warden') {
        idLabel.innerText = 'Warden Employee ID';
        identifierInput.placeholder = 'e.g. WARDEN01';
        submitBtn.innerText = 'Login as Warden';
      } else if (role === 'security') {
        idLabel.innerText = 'Gate Security ID';
        identifierInput.placeholder = 'e.g. SEC01';
        submitBtn.innerText = 'Login as Security';
      }
    }

    async function handleLogin(event) {
      event.preventDefault();

      const message = document.getElementById('loginMessage');
      const submitBtn = document.getElementById('submitBtn');
      const loginId = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;

      if (!loginId || !password) {
        message.textContent = 'Please enter your ID and password.';
        message.className = 'message error';
        return;
      }

      submitBtn.disabled = true;
      message.textContent = 'Logging in...';
      message.className = 'message';

      try {
        const data = await api('/api/auth/login', {
          method: 'POST',
          body: { loginId, password },
        });
        window.location.href = rolePages[data.user.role] || '/index.html';
      } catch (error) {
        message.textContent = error.message;
        message.className = 'message error';
        submitBtn.disabled = false;
      }
    }

    // Scroll Animation Observer
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.fade-in-section').forEach(el => observer.observe(el));
  </script>
</body>
</html>
