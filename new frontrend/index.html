<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Gate Pass - Portal Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Fullscreen Balanced Campus Background Layer -->
  <div class="bg-overlay"></div>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="brand-logo">
      🏷️ GatePass <span>Portal</span>
    </div>
    <div class="nav-links">
      <a href="#" class="nav-item active">Home</a>
      <a href="#" class="nav-item">Pass Status</a>
    </div>
    <button class="btn-login-nav">Login</button>
  </nav>

  <!-- Main Content Container -->
  <main class="main-container">
    <div class="login-card fade-in-section">
      <h2 class="card-title">Portal Login</h2>

      <!-- Role Selector Tabs -->
      <div class="role-tabs">
        <button class="role-tab active" onclick="switchRole(event, 'student')">Student</button>
        <button class="role-tab" onclick="switchRole(event, 'warden')">Warden</button>
        <button class="role-tab" onclick="switchRole(event, 'security')">Security</button>
      </div>

      <!-- Dynamic Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label id="idLabel" for="identifier">Student Registration No / ID</label>
          <input 
            type="text" 
            id="identifier" 
            class="form-control" 
            placeholder="e.g. FIT23CS001 or Scan ID Card" 
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            class="form-control" 
            placeholder="Enter your password" 
            required
          >
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Login as Student</button>
      </form>

      <div class="card-footer">
        Need assistance? <a href="#">Contact Admin</a>
      </div>
    </div>
  </main>

  <!-- Page Footer -->
  <footer class="footer">
    Digital Gate Pass Verification System &bull; Hackathon Edition
  </footer>

  <script>
    let currentRole = 'student';

    function switchRole(event, role) {
      currentRole = role;
      
      const tabs = document.querySelectorAll('.role-tab');
      tabs.forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');

      const idLabel = document.getElementById('idLabel');
      const identifierInput = document.getElementById('identifier');
      const submitBtn = document.getElementById('submitBtn');

      if (role === 'student') {
        idLabel.innerText = 'Student Registration No / ID';
        identifierInput.placeholder = 'e.g. FIT23CS001 or Scan ID Card';
        submitBtn.innerText = 'Login as Student';
      } else if (role === 'warden') {
        idLabel.innerText = 'Warden Employee ID / Email';
        identifierInput.placeholder = 'e.g. warden@college.edu';
        submitBtn.innerText = 'Login as Warden';
      } else if (role === 'security') {
        idLabel.innerText = 'Gate Security ID';
        identifierInput.placeholder = 'e.g. SEC-GATE-01';
        submitBtn.innerText = 'Login as Security';
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const id = document.getElementById('identifier').value;
      const password = document.getElementById('password').value;

      try {
        const formData = new URLSearchParams();
        formData.append('identifier', id);
        formData.append('password', password);
        formData.append('role', currentRole);

        const response = await fetch('login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: formData
        });

        const data = await response.json();
        alert(data.message);
      } catch (err) {
        alert('Logging in with simulated response: Welcome to ' + currentRole.toUpperCase() + ' Portal!');
      }
    }

    // Scroll Animation Observer
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.fade-in-section').forEach(el => observer.observe(el));
  </script>
</body>
</html>
